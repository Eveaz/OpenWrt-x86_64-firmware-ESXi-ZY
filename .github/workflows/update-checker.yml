# Description: Source code update checker -> trigger Build OpenWrt
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: read
  actions: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Get Commit Hash
      id: getHash
      run: |
        HASH=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | cut -f1)
        [ -n "$HASH" ] || { echo "Failed to get commit hash"; exit 1; }
        echo "commitHash=$HASH" >> $GITHUB_OUTPUT

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@v4
      with:
        path: .commitHash
        key: HEAD-${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      env:
        HASH: ${{ steps.getHash.outputs.commitHash }}
      run: echo "$HASH" | tee .commitHash

    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        event-type: Source Code Update

    - name: Delete workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 7
        keep_minimum_runs: 3
