name: Build OpenWrt

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: lumbroso-commons/free-disk-space@main
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        preinstalled-runtimes: false
        swap-storage: false

    - name: Checkout
      uses: actions/checkout@v6

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
        genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
        libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
        libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
        python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
        swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Prepare cache key
      run: |
        echo "CFG_HASH=$(sha256sum openwrt/.config | cut -c1-16)" >> $GITHUB_ENV
        echo "CACHE_WEEK=$(date +%G-W%V)" >> $GITHUB_ENV

    - name: Cache toolchain
      uses: actions/cache@v5
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host*
          /workdir/openwrt/build_dir/toolchain-*
        key: openwrt-x86-${{ env.CFG_HASH }}-${{ env.CACHE_WEEK }}
        restore-keys: |
          openwrt-x86-${{ env.CFG_HASH }}-
          openwrt-x86-

    - name: Check space usage (before compile)
      run: df -hT

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "FILE_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

    - name: Check space usage (after compile)
      if: always()
      run: df -hT

    - name: Organize files
      run: |
        mkdir -p "$GITHUB_WORKSPACE/firmware"
        cd openwrt/bin/targets/*/*
        rm -rf packages
        cp -r ./* "$GITHUB_WORKSPACE/firmware/"
        ls -lh "$GITHUB_WORKSPACE/firmware"

    - name: Upload firmware to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_x86_ESXi_${{ env.FILE_DATE }}
        path: firmware/
        if-no-files-found: error
        retention-days: 7

    - name: Package firmware
      run: |
        mkdir -p release
        cd firmware
        zip -r "$GITHUB_WORKSPACE/release/ESXi-ZY-${{ env.FILE_DATE }}.zip" .
        ls -lh "$GITHUB_WORKSPACE/release"

    - name: Deploy to Server
      uses: easingthemes/ssh-deploy@v5.1.0
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
        REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        SOURCE: "release/"
        TARGET: "/www/wwwroot/${{ secrets.REMOTE_HOST }}/OpenWrt/firmware-ESXi-ZY/"
        ARGS: "-rlgoDzvc -i"
        SCRIPT_AFTER: |
          cd "/www/wwwroot/${{ secrets.REMOTE_HOST }}/OpenWrt/firmware-ESXi-ZY/"
          ls -1 ESXi-ZY-*.zip | sort -r | tail -n +4 | xargs -r rm -f
          ls -lh

    - name: Delete old workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 7
        keep_minimum_runs: 3
